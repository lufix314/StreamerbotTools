<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Quotes Dashboard</title>
        <link rel="stylesheet" href="shared.css" />
        <style>
            .quotes-list {
                list-style: none;
            }

            .quotes-container {
                display: flex;
                align-items: center;
                margin-bottom: 8px;
            }

            .quote-item {
                display: flex;
                width: 100%;
                justify-content: space-between;
                align-items: center;
                padding: 12px;
                background: var(--bg-color);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                transition: border-color 0.2s;
            }

            .quote-item:hover {
                border-color: var(--accent-color);
            }

            .quote-item-info {
                display: flex;
                flex-direction: column;
                gap: 4px;
                flex: 1;
            }

            .quote-item-index {
                font-weight: bold;
                color: var(--accent-color);
                font-size: 10pt;
            }

            .quote-item-quote {
                font-size: 14px;
                font-style: italic;
            }

            .quote-item-author {
                font-size: 12px;
                opacity: 0.8;
            }

            .clip-link {
                color: var(--accent-color);
                text-decoration: none;
                font-size: 12px;
            }

            .clip-link:hover {
                text-decoration: underline;
            }

            .delete-btn {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                background: var(--danger-color);
                border: none;
                cursor: pointer;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 8px;
            }

            .delete-btn:hover:not(:disabled) {
                background: var(--danger-hover-color);
            }

            .delete-btn:focus:not(:disabled) {
                outline: 2px solid var(--danger-color);
                outline-offset: 2px;
            }

            .delete-btn svg {
                width: 14px;
                height: 14px;
            }

            .empty-list {
                text-align: center;
                color: var(--text-color);
                opacity: 0.6;
                padding: 40px;
            }

            label.required::after {
                content: " *";
                color: var(--danger-color);
            }

            input:required:user-invalid,
            textarea:required:user-invalid {
                border-color: var(--danger-color);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Quotes Dashboard</h1>
            <section aria-labelledby="add-quote-heading">
                <h2 id="add-quote-heading">New Quote</h2>
                <form id="add-quote-form" novalidate>
                    <div class="input-group">
                        <label for="quote-input" class="required hidden">Quote text:</label>
                        <textarea id="quote-input"
                                  name="quote"
                                  rows="3"
                                  placeholder="Enter the quote text..."
                                  required></textarea>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="author-input" class="required">Author:</label>
                            <input type="text"
                                   id="author-input"
                                   name="author"
                                   placeholder="Enter author name..."
                                   required />
                        </div>
                        <div class="input-group">
                            <label for="clip-id-input">Clip ID/URL:</label>
                            <input type="text"
                                   id="clip-id-input"
                                   name="clipId"
                                   placeholder="e.g., PrettiestSaltyCrabs4Head-EOSSEL5XAuW-7Mfc" />
                        </div>
                    </div>
                    <div class="button-right">
                        <button type="submit">Add Quote</button>
                    </div>
                </form>
            </section>
            <section aria-labelledby="quotes-heading">
                <h2 id="quotes-heading">
                    <span>Quotes <span id="quotes-count" class="hint">(0)</span></span>
                </h2>
                <ul id="quotes-list" class="quotes-list">
                    <li class="empty-list">No quotes available</li>
                </ul>
            </section>
        </main>
        <script type="module" src="config.js"></script>
        <script type="module" src="dashboard.js"></script>
    </body>
</html>
