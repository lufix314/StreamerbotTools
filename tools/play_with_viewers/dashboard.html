<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Queue Dashboard</title>
        <link rel="stylesheet" href="shared.css" />
        <style>
            .quick-actions {
                justify-content: space-evenly;
            }

            .action {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .queue-list {
                list-style: none;
            }

            .queue-container {
                display: flex;
                align-items: baseline;
            }

            .queue-item {
                display: flex;
                width: 100%;
                justify-content: space-between;
                align-items: center;
                padding: 12px;
                background: var(--bg-color);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                margin-bottom: 8px;
                cursor: grab;
                transition: transform 0.2s, border-color 0.2s;
            }

            .queue-item:hover {
                border-color: var(--accent-color);
            }

            .queue-item.dragging {
                opacity: 0.5;
                transform: scale(1.01);
            }

            .queue-item.drag-over {
                border-color: var(--accent-color);
                border-style: dashed;
            }

            .queue-item-info {
                display: flex;
                align-items: center;
            }

            .queue-item-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .queue-item-index {
                font-weight: bold;
                color: var(--accent-color);
                min-width: 24px;
            }

            .queue-item-name {
                font-weight: 500;
            }

            .kick-btn {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                background: var(--danger-color);
                border: none;
                cursor: pointer;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 8px;
            }

            .kick-btn:hover:not(:disabled) {
                background: var(--danger-hover-color);
            }

            .kick-btn:focus:not(:disabled) {
                outline: 2px solid var(--danger-color);
                outline-offset: 2px;
            }

            .kick-btn svg {
                width: 14px;
                height: 14px;
            }

            .live-badge {
                padding: 2px 8px;
                background: var(--accent-color);
                color: white;
                border-radius: 12px;
                font-size: 10pt;
            }

            .empty-queue {
                text-align: center;
                color: var(--text-color);
                opacity: 0.6;
                padding: 40px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Queue Dashboard</h1>
            <section aria-labelledby="settings-heading">
                <div class="header">
                    <h2 id="settings-heading">Settings</h2>
                    <div class="input-row">
                        <label for="queue-open-toggle" class="hidden">Queue Open:</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="queue-open-toggle" />
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="input-row">
                    <div>
                        <label for="viewer-live">Viewers Live:</label>
                        <input type="number" id="viewer-live" min="0" max="100" value="1" />
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="queue-msg">Queue Message:</label>
                        <textarea id="queue-msg"
                                  rows="3"
                                  placeholder="The queue is open. Join with !join"></textarea>
                    </div>
                </div>
                <div class="button-right">
                    <button id="save-settings-btn">Save</button>
                </div>
            </section>
            <section aria-labelledby="actions-heading">
                <h2 id="actions-heading">Quick Actions</h2>
                <div class="input-row quick-actions">
                    <div class="action">
                        <label for="rotate-count" class="hidden">Rotate count:</label>
                        <input type="number"
                               id="rotate-count"
                               min="1"
                               max="100"
                               value="1"
                               aria-label="Rotate count" />
                        <button id="rotate-btn">Rotate</button>
                    </div>
                    <div class="action">
                        <label for="next-count" class="hidden">Next count:</label>
                        <input type="number"
                               id="next-count"
                               min="1"
                               max="100"
                               value="1"
                               aria-label="Next count" />
                        <button id="next-btn">Next</button>
                    </div>
                </div>
            </section>
            <section aria-labelledby="queue-heading">
                <div class="header">
                    <h2 id="queue-heading">
                        <span>Queue <span class="hint">(drag to reorder)</span></span>
                    </h2>
                    <button id="clear-queue-btn">Clear</button>
                </div>
                <ul id="queue-list" class="queue-list">
                    <li class="empty-queue">No viewers in queue</li>
                </ul>
            </section>
        </main>
        <script type="module" src="config.js"></script>
        <script type="module" src="dashboard.js"></script>
    </body>
</html>
