<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Streamer.bot Tools</title>
        <link rel="stylesheet" href="shared.css" />
        <style>
            #generate-btn {
                display: block;
                margin-left: auto;
                margin-right: auto;
                width: 100%;
                max-width: 300px;
            }

            .result-item {
                margin-bottom: 16px;
                padding-bottom: 16px;
                border-bottom: 1px solid var(--border-color);
            }

            .result-item:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }

            .result-row {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }

            .result-row code {
                background: var(--bg-color);
                padding: 8px 12px;
                border-radius: 4px;
                border: 1px solid var(--border-color);
                word-break: break-all;
                flex: 1;
                min-width: 200px;
            }

            .code-block {
                position: relative;
            }

            .code-block pre {
                background: var(--bg-color);
                padding: 12px;
                border-radius: 4px;
                border: 1px solid var(--border-color);
                overflow-x: auto;
                margin-bottom: 8px;
            }

            .code-block code {
                font-family: "Consolas", "Monaco", monospace;
                font-size: 13px;
                display: block;
            }

            .code-block button {
                margin-right: 8px;
            }

            .action-buttons {
                display: flex;
                gap: 12px;
                margin-top: 8px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Streamer.bot Tools</h1>
            <section>
                <h2>Tool</h2>
                <div class="input-group" id="tool-select-group">
                    <label for="tool-select" class="hidden">Select Tool</label>
                    <select id="tool-select"></select>
                </div>
            </section>
            <section>
                <h2>
                    Connection Settings
                    <span class="hint">(Streamer.bot WebSocket Server settings)</span>
                </h2>
                <div class="input-row">
                    <div class="input-group">
                        <label for="host">Host</label>
                        <input type="text" id="host" value="127.0.0.1" placeholder="127.0.0.1" />
                    </div>
                    <div class="input-group">
                        <label for="port">Port</label>
                        <input type="number" id="port" value="8080" min="1" max="65535" />
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="endpoint">Endpoint</label>
                        <input type="text" id="endpoint" value="/" placeholder="/" />
                    </div>
                    <div class="input-group">
                        <label for="password">Password (optional)</label>
                        <input type="password" id="password" placeholder="Leave empty for no auth" />
                    </div>
                </div>
            </section>
            <button id="generate-btn">Generate Setup</button>
            <section id="results-section" class="hidden">
                <div class="result-item">
                    <div class="header">
                        <h3>
                            Streamer.bot Actions/Command
                            <span class="hint">(Import into Streamer.bot)</span>
                        </h3>
                        <button><a id="open-commands" href="">Show Commands</a></button>
                    </div>
                    <div class="code-block">
                        <pre><code id="sb-content"></code></pre>
                    </div>
                    <div class="action-buttons">
                        <button id="sb-copy">Copy</button>
                        <button><a id="sb-download" href="" download>Download</a></button>
                    </div>
                </div>
                <div id="dashboard-url-container" class="result-item">
                    <h3>
                        Dashboard URL
                        <span class="hint">(Open in your browser to interact with the tool)</span>
                    </h3>
                    <div class="result-row">
                        <code id="dashboard-url"></code>
                        <button>Copy</button>
                    </div>
                </div>
                <div id="overlay-url-container" class="result-item">
                    <h3>
                        Overlay URL
                        <span class="hint">(Add to your OBS as a browser source)</span>
                    </h3>
                    <div class="result-row">
                        <code id="overlay-url"></code>
                        <button>Copy</button>
                    </div>
                </div>
            </section>
        </main>
        <script type="module" src="index.js"></script>
    </body>
</html>
